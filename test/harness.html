<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hotstar AdBlock harness</title>
  <script src="/userScript.js"></script>
  <style>
    body { font: 16px sans-serif; background: #111; color: #eee; padding: 24px; }
    .pass { color: #4caf50; } .fail { color: #f44336; }
    [data-testid^="bbtype-"] { width: 300px; height: 60px; margin: 8px; background: #333; }
  </style>
</head>
<body>
  <h1>Hotstar AdBlock harness</h1>
  <div data-testid="bbtype-hero" id="sponsored"><div><span data-testid="ad-media">sponsored</span></div></div>
  <div data-testid="bbtype-hero" id="editorial"><div>editorial artwork</div></div>
  <a href="#a" id="nav-a">Card A</a> <a href="#b" id="nav-b">Card B</a>
  <ul id="results"></ul>
  <script>
    const results = [];
    function report(name, ok, detail) {
      results.push({ name, ok, detail });
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : '');
      document.getElementById('results').appendChild(li);
    }

    function xhrOutcome(url) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url);
        xhr.onerror = () => resolve({ event: 'error', readyState: xhr.readyState, status: xhr.status });
        xhr.onload = () => resolve({ event: 'load', readyState: xhr.readyState, status: xhr.status });
        xhr.send();
      });
    }

    function elementOutcome(tag, url) {
      return new Promise((resolve) => {
        const el = document.createElement(tag);
        el.onerror = () => resolve('error');
        el.onload = () => resolve('load');
        el.src = url;
        if (tag === 'script') document.head.appendChild(el);
        setTimeout(() => resolve('timeout:' + el.getAttribute('src')), 3000);
      });
    }

    async function run() {
      report('script installed', window.__tvHotstarAdblock === true);

      try {
        await fetch('https://pubads.g.doubleclick.net/gampad/ads?iu=/1/test');
        report('fetch ad blocked', false, 'request resolved');
      } catch (error) {
        report('fetch ad blocked', error instanceof TypeError, String(error));
      }

      const ok = await fetch('/package.json');
      report('fetch normal allowed', ok.ok, 'status ' + ok.status);

      const x = await xhrOutcome('https://videoads.hotstar.com/vast/test.xml');
      report('xhr ad blocked', x.event === 'error' && x.readyState === 4 && x.status === 0, JSON.stringify(x));

      const xn = await xhrOutcome('/package.json');
      report('xhr normal allowed', xn.event === 'load' && xn.status === 200, JSON.stringify(xn));

      report('script src ad blocked', (await elementOutcome('script', 'https://imasdk.googleapis.com/js/sdkloader/ima3.js')) === 'error');
      report('img src ad blocked', (await elementOutcome('img', 'https://googleads.g.doubleclick.net/pagead/viewthroughconversion/1/')) === 'error');
      const attr = document.createElement('img');
      attr.setAttribute('src', 'https://pagead2.googlesyndication.com/pcs/view');
      report('setAttribute src ad blocked', attr.getAttribute('src') === null);

      report('beacon ad swallowed', navigator.sendBeacon('https://googleads.g.doubleclick.net/pagead/x') === true);

      await new Promise((r) => setTimeout(r, 50));
      const sponsored = document.getElementById('sponsored');
      const editorial = document.getElementById('editorial');
      report('sponsored billboard hidden', getComputedStyle(sponsored).display === 'none');
      report('editorial billboard visible', getComputedStyle(editorial).display !== 'none');

      // Billboard added later must also disappear (MutationObserver + :has()).
      const late = document.createElement('div');
      late.setAttribute('data-testid', 'bbtype-late');
      late.innerHTML = '<div><span data-testid="ad-details">ad</span></div>';
      document.body.appendChild(late);
      await new Promise((r) => setTimeout(r, 50));
      report('late billboard hidden', getComputedStyle(late).display === 'none');

      // D-pad: Right from Card A should focus Card B.
      document.getElementById('nav-a').focus();
      document.dispatchEvent(new KeyboardEvent('keydown', { keyCode: 39, bubbles: true }));
      report('d-pad right moves focus', document.activeElement && document.activeElement.id === 'nav-b',
        'active=' + (document.activeElement && document.activeElement.id));

      const activity = JSON.parse(localStorage.getItem('tvHotstarAdblock.activity') || '{}');
      report('counter recorded ad break', activity.count >= 1, JSON.stringify(activity));

      window.__harness = { total: results.length, failed: results.filter((r) => !r.ok).map((r) => r.name) };
    }
    run();
  </script>
</body>
</html>
